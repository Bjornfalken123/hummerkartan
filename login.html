<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0B2740" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hummerkartan" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Logga in · Hummerkartan</title>
  <style>
    :root{--bg:#071726;--panel:#0b2238;--text:#eef5fb;--muted:#9bb4c9;--line:rgba(255,255,255,.10);--accent:#2f80ed;--accent-2:#5ec7df;--danger:#ffb8aa}*{box-sizing:border-box}html,body,button,input{touch-action:manipulation}body{min-height:100vh;margin:0;background:radial-gradient(circle at 50% 10%,#163c5f 0,#0b2238 46%,#071726 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(410px,100%);background:rgba(11,34,56,.96);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.38)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-size:14px;font-weight:950}.brand strong{display:block;font-size:19px}.brand small{display:block;color:var(--muted);margin-top:2px}.message{display:none;border:1px solid rgba(255,184,170,.24);background:rgba(216,119,100,.12);color:var(--danger);padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.45;margin-bottom:14px}.message.show{display:block}form{display:grid;gap:13px}label{display:grid;gap:6px;color:var(--muted);font-size:11px;font-weight:800}input{width:100%;height:46px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:13px;padding:0 12px;font:inherit;font-size:16px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,128,237,.16)}button{height:48px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font:inherit;font-weight:900;cursor:pointer;margin-top:3px;box-shadow:0 8px 22px rgba(47,128,237,.28)}.note{color:var(--muted);font-size:10px;line-height:1.45;margin-top:15px;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="mark">HK</div><div><strong>Hummerkartan</strong><small>Familjens privata sjökort</small></div></div>
    <div id="message" class="message" role="alert"></div>
    <form action="/api/auth/login" method="post" autocomplete="on">
      <label>Användarnamn<input name="username" type="text" autocomplete="username" required autofocus /></label>
      <label>Lösenord<input name="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit">Logga in</button>
    </form>
    <p class="note">Inloggningen sparas på den här enheten i upp till 30 dagar. Logga ut på delade enheter.</p>
  </main>
  <script>
    const p=new URLSearchParams(location.search),m=document.getElementById('message');
    if(p.has('error')){m.textContent='Fel användarnamn eller lösenord.';m.classList.add('show')}
    if(p.has('setup')){m.textContent='Inloggningen är inte färdigkonfigurerad i Cloudflare. Lägg till AUTH_USERNAME, AUTH_PASSWORD och AUTH_SECRET och deploya igen.';m.classList.add('show')}else if(p.has('offline')){m.textContent='Anslut till internet för att logga in första gången på den här enheten.';m.classList.add('show')}
  </script>
</body>
</html>
